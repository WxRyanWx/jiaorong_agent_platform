<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文字识别</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #1f2329; }
      .panel { width: 100%; height: 100%; display: flex; flex-direction: column; background: #fff; }
      .header { -webkit-app-region: drag; height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #e5e6eb; }
      .title { font-size: 16px; font-weight: 600; }
      .close { -webkit-app-region: no-drag; width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #646a73; font-size: 20px; cursor: pointer; }
      .close:hover { background: #f2f3f5; }
      .body { display: flex; flex: 1; min-height: 0; }
      .image-column { width: 393px; padding: 16px; }
      .image-box { width: 100%; height: 100%; border: 0; padding: 0; background: #f7f8fa; cursor: pointer; overflow: hidden; }
      .image-box img { display: block; width: 100%; height: 100%; object-fit: contain; }
      .text-column { flex: 1; border-left: 1px solid #ddd; padding: 16px; min-width: 0; }
      .preview { height: 100%; display: flex; flex-direction: column; }
      .label { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
      .status { color: #86909c; font-size: 14px; }
      .text { flex: 1; margin: 0; white-space: pre-wrap; word-break: break-word; overflow: auto; font: 14px/1.6 inherit; }
      .footer { height: 64px; display: flex; align-items: center; justify-content: flex-end; padding: 0 16px; border-top: 1px solid #e5e6eb; }
      .copy { height: 32px; padding: 0 16px; border: 0; border-radius: 6px; background: #165dff; color: #fff; cursor: pointer; }
      .copy:disabled { background: #c9cdd4; cursor: not-allowed; }
      .lightbox { display: none; position: fixed; inset: 0; z-index: 2; background: rgb(0 0 0 / 80%); align-items: center; justify-content: center; }
      .lightbox.open { display: flex; }
      .lightbox img { max-width: 94vw; max-height: 92vh; object-fit: contain; }
      .lightbox-close { position: absolute; right: 18px; top: 14px; border: 0; background: transparent; color: #fff; font-size: 30px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="header"><div class="title">文字识别</div><button id="close" class="close" aria-label="关闭">×</button></div>
      <div class="body">
        <div class="image-column"><button id="imageBox" class="image-box" aria-label="点击预览大图"><img id="image" alt="原始截图" /></button></div>
        <div class="text-column"><div class="preview"><div class="label">识别预览</div><div id="status" class="status">识别中...</div><pre id="text" class="text"></pre></div></div>
      </div>
      <div class="footer"><button id="copy" class="copy" disabled>复制全文</button></div>
    </div>
    <div id="lightbox" class="lightbox"><button id="lightboxClose" class="lightbox-close" aria-label="关闭预览">×</button><img id="lightboxImage" alt="截图大图预览" /></div>
    <script>
      const byId = (id) => document.getElementById(id)
      const status = byId('status')
      const text = byId('text')
      const copy = byId('copy')
      const lightbox = byId('lightbox')
      let currentText = ''

      const applyPayload = (payload) => {
        const data = payload || {}
        const imageUrl = data.imageBase64 ? `data:image/png;base64,${data.imageBase64}` : ''
        byId('image').src = imageUrl
        byId('lightboxImage').src = imageUrl
        currentText = String(data.text || '').trim()
        text.textContent = currentText
        const loading = Boolean(data.loading)
        const empty = Boolean(data.empty)
        status.hidden = !loading && !empty
        status.textContent = loading ? '识别中...' : empty ? String(data.message || '未识别到文字，当前仅支持中文或英文内容。') : ''
        copy.disabled = loading || empty || !currentText
      }

      window.api?.onMessage?.('ocr-result-data', applyPayload)
      window.api?.getOcrResultData?.().then(applyPayload).catch(() => {})
      byId('close').onclick = () => window.close()
      byId('imageBox').onclick = () => lightbox.classList.add('open')
      byId('lightboxClose').onclick = () => lightbox.classList.remove('open')
      lightbox.onclick = (event) => { if (event.target === lightbox) lightbox.classList.remove('open') }
      copy.onclick = async () => {
        if (!currentText) return
        try {
          await window.api?.copyTextByMain?.(currentText)
          copy.textContent = '已复制'
          setTimeout(() => { copy.textContent = '复制全文' }, 1200)
        } catch {}
      }
      addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return
        if (lightbox.classList.contains('open')) lightbox.classList.remove('open')
        else window.close()
      })
    </script>
  </body>
</html>
