<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #1a1a1a;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        user-select: none;
        -webkit-user-drag: none;
      }
    </style>
  </head>
  <body>
    <img id="pinImage" alt="" />
    <script>
      window.applyPinImage = async (imageBase64) => {
        const image = document.getElementById('pinImage')
        image.src = `data:image/png;base64,${String(imageBase64 || '')}`
        if (typeof image.decode === 'function') await image.decode().catch(() => {})
      }
    </script>
  </body>
</html>
