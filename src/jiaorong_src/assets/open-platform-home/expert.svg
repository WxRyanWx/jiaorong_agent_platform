<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F8FF"/><stop offset="1" stop-color="#E4EDFB"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#3A4E8F"/><stop offset=".55" stop-color="#26346B"/><stop offset="1" stop-color="#1A2450"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#F2F7FF" stop-opacity=".97"/>
      <stop offset="1" stop-color="#CBDBF5" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="avatarBg" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#DCE9FF"/><stop offset="1" stop-color="#AFC7F0"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9FE9DC"/><stop offset="1" stop-color="#3FC0AC"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD79A"/><stop offset="1" stop-color="#E08F1F"/>
    </linearGradient>
    <filter id="sh" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#132048" flood-opacity=".32"/>
    </filter>
    <filter id="sh2" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#132048" flood-opacity=".26"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <linearGradient id="rimLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="960" height="570" fill="url(#bg)"/>
  <rect width="960" height="570" fill="url(#glow)"/>
  <g transform="translate(-144,-85.5) scale(1.3)"><ellipse cx="480" cy="492" rx="190" ry="26" fill="#7E93C4" opacity=".30" filter="url(#blur)"/>

  <!-- 主体：专家身份卡 -->
  <g transform="translate(480,282) rotate(-6)">
    <!-- 外壳 -->
    <rect x="-162" y="-186" width="324" height="372" rx="44" fill="url(#frame)" filter="url(#sh)"/>
    <rect x="-162" y="-186" width="324" height="372" rx="44" fill="none" stroke="#8FA6E8" stroke-opacity=".5" stroke-width="2.5"/>
    <rect x="-156" y="-180" width="312" height="120" rx="36" fill="url(#rimLight)"/>

    <!-- 玻璃内芯 -->
    <rect x="-136" y="-160" width="272" height="320" rx="30" fill="url(#glass)"/>
    <rect x="-136" y="-160" width="272" height="320" rx="30" fill="none" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="2"/>
    <path d="M-136 -110h272" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="2"/>

    <!-- 头像 -->
    <circle cx="0" cy="-88" r="58" fill="url(#avatarBg)"/>
    <circle cx="0" cy="-88" r="58" fill="none" stroke="#FFFFFF" stroke-width="4" opacity=".95"/>
    <g fill="#5C7BC0">
      <circle cx="0" cy="-100" r="21"/>
      <path d="M-35 -40c3.5-21 16-31 35-31s31.5 10 35 31z"/>
    </g>

    <!-- 信息条 -->
    <rect x="-86" y="4" width="172" height="15" rx="7.5" fill="#93AEE0" opacity=".85"/>
    <rect x="-58" y="30" width="116" height="10" rx="5" fill="#AEC3E8" opacity=".9"/>

    <!-- 标签：认证 / 领域 -->
    <g transform="translate(-86,62)">
      <rect width="74" height="28" rx="14" fill="url(#mint)"/>
      <circle cx="16" cy="14" r="3.4" fill="#FFFFFF" opacity=".95"/>
      <rect x="26" y="11" width="34" height="6" rx="3" fill="#FFFFFF" opacity=".9"/>
    </g>
    <g transform="translate(4,62)">
      <rect width="82" height="28" rx="14" fill="#DCE8FA"/>
      <rect x="14" y="11" width="54" height="6" rx="3" fill="#8FA9D8"/>
    </g>

    <!-- 认证徽章 -->
    <g transform="translate(112,128)">
      <circle r="34" fill="url(#amber)" filter="url(#sh2)"/>
      <circle r="34" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="3"/>
      <path d="M-14 1l9 10 19-21" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- 左侧小卡：知识节点 -->
  <g transform="translate(214,178) rotate(-14)" filter="url(#sh2)">
    <rect x="-46" y="-46" width="92" height="92" rx="24" fill="url(#frame)"/>
    <rect x="-36" y="-36" width="72" height="72" rx="18" fill="#DCE9FF" opacity=".92"/>
    <g fill="#6F8FD0">
      <circle cx="-12" cy="-12" r="6"/><circle cx="14" cy="-12" r="6"/>
      <circle cx="-12" cy="14" r="6"/><circle cx="14" cy="14" r="6"/>
    </g>
    <path d="M-12 -12L14 14M14 -12L-12 14" stroke="#9FB8E4" stroke-width="2.5" opacity=".9"/>
  </g>

  <!-- 右下：琥珀奖章 -->
  <g transform="translate(752,392)" filter="url(#sh2)">
    <circle r="42" fill="url(#amber)"/>
    <circle r="42" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="3"/>
    <path d="M0 -19l6.2 12.6 13.8 2-10 9.8 2.4 13.8L0 12.6l-12.4 6.6 2.4-13.8-10-9.8 13.8-2z" fill="#FFFFFF" opacity=".94"/>
  </g>

  <!-- 右上：玻璃小球 -->
  <g transform="translate(716,132)" filter="url(#sh2)">
    <circle r="27" fill="#CFE0FA" opacity=".95"/>
    <circle r="27" fill="none" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="3"/>
    <ellipse cx="-8" cy="-10" rx="8" ry="5" fill="#FFFFFF" opacity=".75"/>
  </g>
</g></svg>